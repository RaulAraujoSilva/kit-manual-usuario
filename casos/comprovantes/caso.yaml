# Elementos que só existem fora da produção: nunca aparecem em print nem vídeo.
ocultar:
  - css: 'aside[aria-label="Ambiente"]'
  - bloco_do_texto: "Ambiente de teste: entrar como"

# Volta ao estado inicial antes de cada roteiro que altera dados.
# A cópia `.cache/estado-inicial.dump` é tirada uma vez, logo depois da carga de teste (ver README do caso).
estado:
  # As rotinas agendadas (lembretes) ficam paradas durante a gravação, para nada mudar no meio de um roteiro.
  restaurar:
    - docker stop {rotinas}
    - docker cp {dump} {db}:/tmp/estado.dump
    - docker exec {db} psql -q -U comprovantes -d comprovantes -c "select pg_terminate_backend(pid) from pg_stat_activity where datname = current_database() and pid <> pg_backend_pid()"
    - docker exec {db} pg_restore -U comprovantes -d comprovantes --clean --if-exists --no-owner /tmp/estado.dump
  salvar:
    - docker exec {db} pg_dump -U comprovantes -d comprovantes -Fc -f /tmp/estado.dump
    - docker cp {db}:/tmp/estado.dump {dump}

marca:
  cor_primaria: "#0A60A2"
  cor_texto: "#14243A"
  cor_destaque: "#D0006F"
  logotipo: marca/agenersa-logotipo.png
  logotipo_branco: marca/agenersa-logotipo-branco.png

voz:
  modelo: microsoft/mai-voice-2.1
  voz: "pt-BR-Luana:MAI-Voice-2.1"
