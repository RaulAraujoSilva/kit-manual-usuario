# Caso: sistema de comprovantes de saúde e educação (AGENERSA).
# Ambiente local com dados fictícios; o "hoje" do sistema é fixo em 05/11/2026.
sistema: Comprovantes de saúde e educação
orgao: AGENERSA
endereco: http://127.0.0.1:3005
caixa_email: http://127.0.0.1:8028

# Cópias do ambiente em portas próprias, para capturar e gravar em paralelo (cada uma com banco próprio).
# Escolha com KIT_AMBIENTE=<nome>; sem a variável, vale a primeira. Os {nomes} entram nos comandos de estado.
ambientes:
  manual:
    endereco: http://127.0.0.1:3005
    caixa_email: http://127.0.0.1:8028
    vars: { db: manual-db-1, rotinas: manual-rotinas-1 }
  manual2:
    endereco: http://127.0.0.1:3006
    caixa_email: http://127.0.0.1:8029
    vars: { db: manual2-db-1, rotinas: manual2-rotinas-1 }
  manual3:
    endereco: http://127.0.0.1:3007
    caixa_email: http://127.0.0.1:8030
    vars: { db: manual3-db-1, rotinas: manual3-rotinas-1 }

# Contas da carga de teste (só valem no ambiente local, com a massa fictícia).
perfis:
  servidor:
    nome: Servidora 050213 (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "50.213-4" }
        - { rotulo: "Senha", exato: true, valor: "Servidora-050213-Teste!" }
      botao: Entrar
      espera_url: /servidor

  analista:
    nome: Analista de RH 01 (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "60.101-0" }
        - { rotulo: "Senha", exato: true, valor: "Analista-RH-Teste-2026!" }
      botao: Entrar
      espera_url: /rh

  coordenacao:
    nome: Coordenação de RH (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "60.100-2" }
        - { rotulo: "Senha", exato: true, valor: "Coordenacao-RH-Teste-2026!" }
      botao: Entrar
      espera_url: /rh

  administracao:
    nome: Administração do sistema (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "admin" }
        - { rotulo: "Senha", exato: true, valor: "Administracao-Teste-2026!" }
      botao: Entrar
