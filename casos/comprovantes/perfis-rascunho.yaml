# Rascunho dos perfis do RH, da coordenação e da administração, no formato do bloco `perfis` do caso.yaml.
# Para usar: copiar as três entradas para dentro de `perfis:` no caso.yaml (este arquivo não é lido pelo motor).
#
# Contas da carga de teste (prisma/seed/USUARIOS_DE_TESTE.md do sistema): só valem no ambiente local, com a massa
# fictícia; nenhuma destas senhas existe em homologação ou produção. Cinco senhas erradas seguidas bloqueiam a conta
# por 15 minutos; a sessão expira com 30 minutos sem uso.
#
# A analista do RH também é servidora (perfis RH e SRV): entra em /rh e chega aos próprios comprovantes por
# "Ver meus comprovantes", no menu com o nome dela. Ela não tem auxílio ativo, então a área do servidor dela fica vazia:
# os roteiros do servidor usam sempre o perfil `servidor` (Servidora 050213).
perfis:
  analista:
    nome: Analista de RH 01 (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "60.101-0" }
        - { rotulo: "Senha", exato: true, valor: "Analista-RH-Teste-2026!" }
      botao: Entrar
      espera_url: /rh

  coordenacao:
    nome: Coordenação de RH (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "60.100-2" }
        - { rotulo: "Senha", exato: true, valor: "Coordenacao-RH-Teste-2026!" }
      botao: Entrar
      espera_url: /rh

  administracao:
    nome: Administração do sistema (exemplo)
    entrada:
      pagina: /entrar
      campos:
        - { rotulo: "CPF ou matrícula", valor: "admin" }
        - { rotulo: "Senha", exato: true, valor: "Administracao-Teste-2026!" }
      botao: Entrar
      espera_url: /admin
