# O painel do RH
# Perfil: analista | Tela: TL-06 /rh | UC-16 (indicadores), entrada para UC-07, UC-08, UC-10, UC-11 | Vídeo: V07
# Manual: Manual do RH › Painel do RH e indicadores
#
# Estado: inicial (os números da fila são os da carga: 55 conformes, 23 divergências, 21 na amostra e 17 servidores
#   sem envio em outubro/2026).
# Altera dados: não.
id: rh-painel
titulo: O painel do RH
perfil: analista
estado: inicial
inicio: /rh
capitulo: capitulos/rh-painel.md

abertura:
  titulo: O painel do RH
  subtitulo: Manual do RH

fecho:
  linhas:
    - "Manual do RH: capítulo O painel do RH."

passos:
  - id: competencia
    narracao: >-
      O painel do RH abre na competência em andamento, com o fechamento do lote e o prazo dos servidores.
    texto: >-
      O painel abre na competência em andamento, com a data de **fechamento do lote**, a folha do pagamento e o
      **prazo dos servidores**. A barra logo abaixo mostra quantos comprovantes do mês já foram aprovados.
    alvo: { papel: heading, nome: Outubro de 2026, exato: true }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: seletor
    narracao: Para ver outro mês, escolha a competência no alto e clique em Ver.
    texto: >-
      Para ver outro mês, escolha em **Competência**, no alto, e clique em **Ver**. O menu e os contadores passam a
      valer para a competência escolhida.
    alvo: { rotulo: Competência, exato: true }
    acao: nenhuma
    captura: true

  - id: fila
    narracao: >-
      Em O que precisa de você, quatro filas: conformes para aprovar, divergências, amostra e quem ainda não enviou.
      Cada atalho leva à lista certa.
    texto: >-
      **O que precisa de você** mostra quatro filas: **Conformes** para aprovar, **Divergências** para decidir,
      **Amostra** sorteada para conferir e **Sem envio**. Cada atalho leva à lista já filtrada, com o mesmo número.
    alvo: { papel: region, nome: O que precisa de você }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: grafico
    narracao: O gráfico mostra os comprovantes de cada mês do ano. Prefere números? Clique em Ver como tabela.
    texto: >-
      O gráfico mostra os comprovantes de cada mês do ano: aprovados, aguardando, devolvidos e reprovados. Clique em
      **Ver como tabela** para ver os mesmos números numa tabela.
    alvo: { papel: button, nome: Ver como tabela }
    acao: clicar
    captura: true

  - id: indicadores
    narracao: Depois, os indicadores do processo, como a taxa de devolução e os servidores em dia.
    texto: >-
      **Indicadores do processo**: aprovados sem análise individual, taxa de devolução, taxa de erro na amostra,
      servidores em dia e tempo entre envio e pagamento. As metas são fixadas depois de três competências medidas.
    alvo: { papel: heading, nome_comeca: "Indicadores do processo" }
    acao: nenhuma
    captura: true

  - id: pago
    narracao: Em Pago no mês anterior, o lote do mês passado e o pagamento na folha.
    texto: >-
      **Pago no mês anterior** mostra o lote da competência anterior e o pagamento na folha. Enquanto esse lote não é
      gerado, o quadro avisa.
    alvo: { papel: heading, nome: Pago no mês anterior }
    acao: nenhuma
    captura: true

  - id: cobrancas
    narracao: >-
      Por fim, as cobranças automáticas: os lembretes do mês e quem ainda não enviou. O interruptor pausa todos os
      lembretes, se preciso.
    texto: >-
      **Cobranças automáticas** mostra os lembretes do mês (15 dias, 7 dias e a véspera do prazo), os primeiros
      servidores sem envio e o interruptor **Cobrança geral**, que pausa todos os lembretes.
    alvo: { papel: heading, nome: Cobranças automáticas }
    acao: nenhuma
    captura: true

  - id: meus-comprovantes
    narracao: >-
      Se você também recebe o auxílio, abra o menu com o seu nome para ver os seus comprovantes.
    texto: >-
      Se você também recebe o auxílio, clique no seu nome, no alto, para abrir o menu.
    alvo: { css: "header details > summary" }
    acao: clicar
    captura: true

  - id: menu-usuario
    narracao: >-
      Em Ver meus comprovantes, você envia os seus, que outra pessoa do RH decide. No mesmo menu, você troca a senha e
      sai.
    texto: >-
      Clique em **Ver meus comprovantes** para enviar e acompanhar os seus comprovantes. Eles são decididos por outra
      pessoa do RH. No mesmo menu ficam **Trocar senha** e **Sair**.
    alvo: { papel: link, nome: Ver meus comprovantes }
    acao: nenhuma
    captura: true
