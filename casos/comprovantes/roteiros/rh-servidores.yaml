# Servidores e dependentes: consultar e incluir um dependente
# Perfil: analista | Telas: TL-12 /rh/servidores e /rh/servidores/[servidor_id] | UC-13 | Vídeo: V12
# Manual: Manual do RH › Servidores e dependentes
#
# Estado: inicial. A Servidora 050213 com os dois dependentes da carga (o dependente incluído aqui aparece no painel
#   dela; os roteiros do servidor partem do estado inicial e não o veem).
# Documentos fictícios: dados de um dependente fictício: nome "Dependente 050213-3 (exemplo)", CPF fictício com dígitos
#   válidos 778.123.456-10 (não pertence a ninguém; prefixo 77 reservado aos testes do kit), nascimento 10/03/2019.
# Altera dados: inclui o dependente (inscrito na saúde, como vem marcado no formulário).
id: rh-servidores
titulo: Servidores e dependentes
perfil: analista
estado: inicial
inicio: /rh/servidores
capitulo: capitulos/rh-servidores.md

abertura:
  titulo: Servidores e dependentes
  subtitulo: Manual do RH

fecho:
  linhas:
    - "Manual do RH: capítulo Servidores e dependentes."

passos:
  - id: lista
    narracao: >-
      Em Servidores, você vê quem tem direito a cada auxílio, com a situação da saúde e da educação e os dependentes.
    texto: >-
      **Servidores e dependentes** lista quem tem direito a cada auxílio, com a situação da saúde e da educação e o
      número de dependentes. Filtre por auxílio, vínculo ou situação.
    alvo: { papel: form, nome: Filtros da lista }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: buscar
    narracao: Busque o servidor pelo nome ou pela matrícula.
    texto: Em **Buscar nome ou matrícula**, digite o nome ou a matrícula e clique em **Filtrar**.
    alvo: { rotulo: Buscar nome ou matrícula }
    acao: preencher
    valor: "50.213-4"
    captura: true

  - id: filtrar
    narracao: ""   # sem fala: continua a frase do passo anterior
    texto: Clique em **Filtrar**.
    alvo: { papel: button, nome: Filtrar, exato: true, dentro: { papel: form, nome: Filtros da lista } }
    acao: clicar
    captura: false

  - id: abrir
    narracao: Clique no servidor para abrir o cadastro.
    texto: Clique no nome do servidor para abrir o cadastro.
    alvo: { papel: link, nome: "50.213-4" }
    acao: clicar
    captura: true

  - id: auxilios
    narracao: >-
      O cadastro mostra a situação de cada auxílio, os dependentes e o histórico. Os atalhos levam aos comprovantes e à
      cobrança deste servidor.
    texto: >-
      O cadastro mostra os **dados do servidor**, a **situação dos auxílios**, os **dependentes** e o **histórico**. Os
      atalhos **Ver comprovantes do servidor** e **Ver cobrança do servidor** abrem as listas já filtradas.
      **Exportar dados do titular (LGPD)** atende pedidos de acesso aos dados.
    alvo: { papel: heading, nome: Situação dos auxílios }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: incluir
    narracao: Para incluir um dependente, abra Incluir dependente.
    texto: Clique em **Incluir dependente**.
    alvo: { css: 'summary:has-text("Incluir dependente")' }
    acao: clicar
    captura: true

  - id: nome
    narracao: Preencha o nome, o CPF e a data de nascimento.
    texto: Em **Nome**, digite o nome completo do dependente.
    alvo: { rotulo: Nome, exato: true, dentro: { papel: form, nome: Incluir dependente } }
    acao: preencher
    valor: "Dependente 050213-3 (exemplo)"
    captura: true

  - id: cpf
    narracao: ""   # sem fala: passo rápido
    texto: Em **CPF**, digite só os 11 números.
    alvo: { rotulo: CPF, exato: true, dentro: { papel: form, nome: Incluir dependente } }
    acao: preencher
    valor: "77812345610"
    captura: false

  - id: nascimento
    narracao: ""   # sem fala: passo rápido
    texto: Em **Data de nascimento**, informe a data.
    alvo: { rotulo: Data de nascimento, exato: true, dentro: { papel: form, nome: Incluir dependente } }
    acao: preencher
    valor: "2019-03-10"
    captura: false

  - id: parentesco
    narracao: Escolha o parentesco e em quais auxílios ele será inscrito.
    texto: >-
      Escolha o **Parentesco** e marque **Inscrever no auxílio-saúde** e, se for o caso, **Inscrever no
      auxílio-educação**. A inscrição vale desde o início da competência em andamento.
    alvo: { rotulo: Parentesco, dentro: { papel: form, nome: Incluir dependente } }
    acao: selecionar
    valor: Filho(a)
    captura: true

  - id: salvar
    narracao: Clique em Incluir dependente.
    texto: >-
      Clique em **Incluir dependente**.
    alvo: { papel: button, nome: Incluir dependente, exato: true, dentro: { papel: form, nome: Incluir dependente } }
    acao: clicar
    espera_texto: Dependente 050213-3 (exemplo) incluído.
    captura: true

  - id: incluido
    narracao: >-
      Pronto. O dependente aparece no cadastro e passa a poder constar nos comprovantes do servidor.
    texto: >-
      O dependente aparece em **Dependentes**, com a situação em cada auxílio, e passa a poder constar nos comprovantes
      do servidor. No cartão do dependente, **Encerrar inscrição na saúde** (ou na educação) tira o dependente do
      auxílio, **Inscrever na educação** (ou na saúde) o inclui, e **Alterar dados de** corrige nome, parentesco ou
      nascimento.
    alvo: { papel: article, tem_titulo: Dependente 050213-3 (exemplo) }
    acao: nenhuma
    captura: true
