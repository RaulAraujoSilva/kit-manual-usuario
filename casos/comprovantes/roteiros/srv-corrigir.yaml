# Corrigir um comprovante devolvido
# Perfil: servidor (Servidora 050213) | Tela: TL-04 /servidor/corrigir/[id] (pelo painel) | UC-05 | Vídeo: V05
# Manual: Guia do servidor › Corrigir um comprovante devolvido
#
# Estado: srv-devolvido (preparo preparo/srv-devolvido): o comprovante da Escola Infantil Pé de Feijão (educação,
#   Dependente 050213-2) Devolvido pelo RH com o motivo "Comprovante incompleto (sem autenticação bancária)", prazo
#   20/11/2026.
# Documento fictício: documentos/comprovante-pix-pe-de-feijao-outubro.pdf (PDF com texto, autenticação fictícia
#   diferente da original); a nova leitura passa nas seis regras.
# Altera dados: o comprovante volta à fila do RH com protocolo de reenvio (final -R1).
id: srv-corrigir
titulo: Corrigir um comprovante devolvido
perfil: servidor
estado: srv-devolvido
inicio: /servidor
capitulo: capitulos/srv-corrigir.md

abertura:
  titulo: Corrigir um comprovante devolvido
  subtitulo: Guia do servidor

fecho:
  linhas:
    - Dúvidas? Fale com o RH pelo ramal 6457.
    - "Guia do servidor: capítulo Corrigir um comprovante devolvido."

passos:
  - id: agora
    narracao: >-
      Quando o RH devolve um comprovante, o painel avisa logo no alto, com o prazo. Clique em Corrigir comprovante
      devolvido.
    texto: >-
      Quando o RH devolve um comprovante, o cartão **Agora** do painel mostra a devolução e o prazo. Clique em
      **Corrigir comprovante devolvido**. Também dá para chegar pelo aviso, em **Avisos**.
    alvo: { papel: link, nome: Corrigir comprovante devolvido }
    acao: clicar
    captura: true
    enquadrar: tela

  - id: motivo
    narracao: No alto, o motivo da devolução e o prazo para enviar o documento corrigido.
    texto: No alto da tela ficam o **motivo** da devolução, a mensagem do RH e o **prazo** para enviar o documento corrigido.
    alvo: { papel: region, nome_comeca: "Devolvido pelo RH em" }
    acao: nenhuma
    captura: true

  - id: documentos
    narracao: >-
      Em Documentos da despesa, só o documento devolvido precisa ser trocado. O outro fica mantido.
    texto: >-
      Em **Documentos da despesa**, o documento devolvido aparece marcado como **Devolvido**; o outro, como
      **Mantido**. Só o devolvido precisa ser trocado.
    alvo: { papel: region, nome: Documentos da despesa }
    acao: nenhuma
    captura: true

  - id: escolher
    narracao: Clique em Escolher arquivo e selecione o documento corrigido. No celular, pode fotografar de novo.
    texto: >-
      Clique em **Escolher arquivo** e selecione o documento corrigido, completo e legível. No celular, use
      **Fotografar de novo**.
    alvo: { papel: button, nome: Escolher arquivo, exato: true }
    acao: enviar_arquivos
    arquivos:
      - documentos/comprovante-pix-pe-de-feijao-outubro.pdf
    campo_arquivos: { rotulo: Escolher arquivo, exato: true }
    espera_texto: comprovante-pix-pe-de-feijao-outubro.pdf
    captura: true

  - id: analise
    narracao: O novo documento é lido e conferido na hora.
    texto: >-
      O novo documento é lido e conferido na hora (**Análise automática**). Se aparecer uma pendência, resolva antes de
      reenviar.
    alvo: { css: 'ul:has(strong:text-is("Regra 6."))' }
    acao: nenhuma
    captura: true

  - id: reenviar
    narracao: Clique em Reenviar ao RH.
    texto: Clique em **Reenviar ao RH**.
    alvo: { papel: button, nome: Reenviar ao RH, exato: true }
    acao: clicar
    captura: true

  - id: confirmar
    narracao: Confirme o reenvio.
    texto: Na confirmação, clique em **Reenviar ao RH**. Só o documento trocado é substituído.
    alvo: { papel: button, nome: Reenviar ao RH, exato: true, dentro: { papel: dialog } }
    acao: clicar
    captura: true

  - id: reenviado
    narracao: >-
      Pronto. O comprovante voltou para o RH com um novo protocolo, o valor reembolsável e a folha prevista para o
      pagamento.
    texto: >-
      O comprovante volta para a fila do RH com protocolo de reenvio (final **-R1**), o valor reembolsável e a folha
      prevista. Se houver nova devolução, você recebe outro aviso. Corrigido depois do prazo, o comprovante entra no
      lote do mês seguinte.
    alvo: { papel: status, tem_titulo: Reenviado ao RH }
    acao: nenhuma
    captura: true
