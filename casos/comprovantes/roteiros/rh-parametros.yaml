# Calendário, tetos e parâmetros
# Perfil: analista | Tela: TL-13 /rh/parametros (abas Calendário, Tetos, Parâmetros, Catálogos) | UC-15 | Vídeo: V13
# Manual: Manual do RH › Calendário, tetos e parâmetros
#
# Estado: rh-base (inicial com o ato do teto da educação em texto de exemplo; ver preparo/rh-base.sql). Teto da saúde em vigor: IN CODIR nº 34/2012 (carga).
# Documentos fictícios: nenhum. Ato de origem e valores fictícios; vigência futura (01/01/2027), para não mudar a
#   conferência de outubro/2026.
# Altera dados: cria a versão do teto da saúde vigente a partir de 01/01/2027.
id: rh-parametros
titulo: Calendário, tetos e parâmetros
perfil: analista
estado: rh-base
inicio: /rh
capitulo: capitulos/rh-parametros.md

abertura:
  titulo: Calendário, tetos e parâmetros
  subtitulo: Manual do RH

fecho:
  linhas:
    - "Manual do RH: capítulo Calendário, tetos e parâmetros."

passos:
  - id: abrir
    narracao: No menu, clique em Calendário e parâmetros.
    texto: No menu do RH, clique em **Calendário e parâmetros**.
    alvo: { papel: link, nome_comeca: "Calendário e parâmetros", dentro: { papel: navigation, nome: Menu do RH } }
    acao: clicar
    captura: true

  - id: calendario
    narracao: >-
      O calendário mostra, para cada mês, a abertura, o prazo do servidor, o fechamento do lote e os lembretes. Data em
      dia sem expediente aparece com o próximo dia útil.
    texto: >-
      A aba **Calendário** mostra, por competência, a abertura, o **prazo do servidor**, o **fechamento do lote**, as
      datas dos lembretes e a situação (Fechada, Aberta ou Futura). Quando a data cai em dia sem expediente, a tela avisa
      e mostra o próximo dia útil. Na competência aberta ou futura, **Ajustar o calendário de** muda as datas daquele
      mês. **Ano anterior** e **Ano seguinte** trocam o ano.
    alvo: { papel: row, nome_comeca: "outubro/2026" }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: tetos
    narracao: Na aba Tetos, ficam os valores máximos de reembolso, com a vigência e o ato de origem.
    texto: >-
      A aba **Tetos** mostra o teto da saúde por grupo etário e o da educação por dependente, cada um com a vigência e
      o ato de origem.
    alvo: { papel: link, nome: Tetos, exato: true, dentro: { papel: navigation, nome: Partes dos parâmetros } }
    acao: clicar
    captura: true

  - id: nova-vigencia
    narracao: Quando sair uma tabela nova, cadastre uma nova vigência. A atual continua valendo até a véspera.
    texto: >-
      Quando sair uma tabela nova, clique em **Nova vigência do teto da saúde**. A versão em vigor continua até a
      véspera da nova; comprovantes já conferidos ficam com o teto da época.
    alvo: { css: 'summary:has-text("Nova vigência do teto da saúde")' }
    acao: clicar
    captura: true

  - id: data
    narracao: Informe a data de início, o ato de origem e o valor de cada grupo.
    texto: Em **Vigência a partir de**, informe a data de início da nova tabela.
    alvo: { rotulo: Vigência a partir de, dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "2027-01-01"
    captura: true

  - id: ato
    narracao: ""   # sem fala: a narração do passo anterior cobre os campos
    texto: Em **Ato de origem**, informe o ato que fixou a tabela.
    alvo: { rotulo: Ato de origem, dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "Ato de exemplo nº 1/2027 (atualização pelo INPC)"
    captura: false

  - id: grupo-1
    narracao: ""
    texto: Em **Valor do grupo I (R$)**, informe o valor do ato, em reais.
    alvo: { rotulo: Valor do grupo I (R$), dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "250,00"
    captura: false

  - id: grupo-2
    narracao: ""
    texto: Em **Valor do grupo II (R$)**, informe o valor do ato, em reais.
    alvo: { rotulo: Valor do grupo II (R$), dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "330,00"
    captura: false

  - id: grupo-3
    narracao: ""
    texto: Em **Valor do grupo III (R$)**, informe o valor do ato, em reais.
    alvo: { rotulo: Valor do grupo III (R$), dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "410,00"
    captura: false

  - id: grupo-4
    narracao: ""
    texto: Em **Valor do grupo IV (R$)**, informe o valor do ato, em reais.
    alvo: { rotulo: Valor do grupo IV (R$), dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "490,00"
    captura: false

  - id: grupo-5
    narracao: ""
    texto: Em **Valor do grupo V (R$)**, informe o valor do ato, em reais.
    alvo: { rotulo: Valor do grupo V (R$), dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: preencher
    valor: "570,00"
    captura: true

  - id: cadastrar
    narracao: Clique em Cadastrar nova vigência.
    texto: Clique em **Cadastrar nova vigência**. A versão nova aparece em **Outras versões**, como futura.
    alvo: { papel: button, nome: Cadastrar nova vigência, dentro: { papel: form, nome: Nova vigência do teto da saúde } }
    acao: clicar
    espera_texto: Nova versão do teto da saúde vigente a partir de 01/01/2027.
    captura: true

  - id: cadastrada
    narracao: Pronto. A nova versão fica cadastrada, com a data de início.
    texto: >-
      A tela confirma a nova versão, vigente a partir da data informada. A tabela em vigor continua valendo até a
      véspera.
    alvo: { texto: Nova versão do teto da saúde vigente a partir de 01/01/2027. }
    acao: nenhuma
    captura: true

  - id: catalogos
    narracao: >-
      Na aba Parâmetros ficam os valores das regras, como o percentual da amostra. Em Catálogos, os motivos e as
      rubricas da folha.
    texto: >-
      A aba **Parâmetros** mostra os valores de que as regras dependem (percentual da amostra, dias do calendário, dias
      dos lembretes e outros), cada um com a vigência e a origem; **Nova vigência** cadastra um valor novo a partir de
      uma data. Para os motivos e as rubricas, clique em **Catálogos**.
    alvo: { papel: link, nome: Catálogos, exato: true, dentro: { papel: navigation, nome: Partes dos parâmetros } }
    acao: clicar
    captura: true

  - id: motivos
    narracao: >-
      Os motivos aparecem nas listas de devolução, reprovação, glosa e suspensão. Motivo já usado não muda de texto:
      desative e cadastre outro.
    texto: >-
      Em **Catálogos** ficam os **motivos** de devolução, reprovação, glosa e suspensão, que aparecem nas listas de
      decisão, e as **rubricas da folha**. Você pode cadastrar um motivo, corrigir o texto de um motivo ainda não usado
      ou **Desativar** um motivo; o que já foi usado (**em uso**) fica no histórico.
    alvo: { papel: heading, nome: "Motivos de devolução, reprovação, glosa e suspensão" }
    acao: nenhuma
    captura: true
