# RASCUNHO — Consultar a trilha de auditoria e verificar o encadeamento
# Perfil: administracao | Tela: TL-14 /admin?aba=trilha | UC-17 | Vídeo: V18 (parte 3 de 3)
# Manual: Manual da administração › Trilha de auditoria, filtros e exportação
#
# Estado necessário: qualquer um; fica mais ilustrativo depois da sequência longa (há eventos de criar conta, decidir,
#   gerar lote). Com a carga pura, filtrar pela ação "Carga de teste" em vez de "Criou conta".
# Documentos fictícios: nenhum.
# Altera dados: só registra na trilha a consulta e a conferência (cada consulta é um evento). "Exportar CSV" não é
#   clicado (o motor não trata download).
id: adm-trilha
titulo: Consultar a trilha de auditoria
perfil: administracao
estado: atual
inicio: /admin
capitulo: capitulos/adm-trilha.md

abertura:
  titulo: Trilha de auditoria
  subtitulo: Manual da administração

fecho:
  linhas:
    - "Manual da administração: capítulo Trilha de auditoria."

passos:
  - id: aba
    narracao: >-
      Toda ação no sistema fica registrada numa trilha que não se altera. Clique na aba Trilha de auditoria.
    texto: >-
      Toda ação no sistema (entradas, aberturas de comprovante, decisões, lotes, mudanças de cadastro e de contas) fica
      registrada numa trilha encadeada. Clique na aba **Trilha de auditoria**.
    alvo: { papel: link, nome: Trilha de auditoria, exato: true, dentro: { papel: navigation, nome: Partes da administração } }
    acao: clicar
    captura: true

  - id: filtros
    narracao: >-
      Filtre por autor, período, protocolo do comprovante, matrícula, competência ou ação.
    texto: >-
      Use os filtros: **Autor**, período (**De** e **Até**), **Protocolo do comprovante**, matrícula do servidor,
      competência e **Ação**.
    alvo: { rotulo: Ação, exato: true }
    acao: selecionar   # precisa do motor: ação "selecionar"
    valor: Criou conta
    captura: true

  - id: consultar
    narracao: E clique em Consultar.
    texto: Clique em **Consultar**.
    alvo: { papel: button, nome: Consultar, exato: true }
    acao: clicar
    captura: false

  - id: eventos
    narracao: >-
      Cada evento mostra quando, quem, a ação e o objeto, descrito em termos de gente: o comprovante, o servidor, a
      competência.
    texto: >-
      Cada evento mostra a data e a hora, o **autor** com o perfil, a **ação** e o **objeto** (por exemplo, "Comprovante
      CSE-…, de Servidora …, matrícula …, outubro/2026"). **Detalhe** mostra o antes e o depois, campo a campo; o
      identificador longo fica em **Copiar identificador**.
    alvo: { css: ':nth-match(summary:has-text("Detalhe"), 1)' }   # conferir: o primeiro "Detalhe" da lista
    acao: clicar
    captura: true

  - id: verificar
    narracao: Para conferir que nada foi alterado, clique em Verificar encadeamento.
    texto: >-
      Clique em **Verificar encadeamento** para conferir que nenhum evento foi alterado ou apagado. A rotina diária
      também confere.
    alvo: { papel: button, nome: Verificar encadeamento }
    acao: clicar
    espera_texto: Trilha íntegra
    captura: true

  - id: integra
    narracao: Trilha íntegra. Cada evento ganha o selo do encadeamento.
    texto: >-
      O resultado aparece em seguida: **Trilha íntegra** e o número de eventos verificados, ou o ponto exato em que o
      encadeamento quebrou.
    alvo: { texto: "Trilha íntegra:" }   # conferir: status "Trilha íntegra: N eventos verificados."
    acao: nenhuma
    captura: true

  - id: exportar
    narracao: Para levar a consulta para fora, use Exportar CSV. A exportação também fica registrada.
    texto: >-
      **Exportar CSV com os N eventos desta consulta** baixa os eventos filtrados. A exportação também fica registrada
      na trilha.
    alvo: { papel: link, nome_comeca: "Exportar CSV com os" }
    acao: nenhuma
    captura: true
