# RASCUNHO — Arrumar as despesas antes de enviar (corrigir dados, separar, mover, retirar e desfazer)
# Perfil: servidor (Servidora 050213) | Tela: TL-03 /servidor/enviar | UC-02, UC-03 | Vídeo: sem vídeo próprio
#   (complemento do V03; pode virar um vídeo curto se a validação com servidores pedir)
# Manual: Guia do servidor › Enviar os comprovantes do mês (seção "Se algo não estiver certo")
#
# Estado necessário: inicial (os mesmos três PDFs do srv-enviar, ainda não enviados).
# Documentos fictícios: os três PDFs de casos/comprovantes/documentos.
# Altera dados: deixa duas despesas guardadas (rascunho), sem enviar. O roteiro seguinte deve restaurar o banco.
# Conferir: depois de "Separar documentos" pode haver dois cartões com o nome "Colégio Horizonte (exemplo)"; os passos
#   seguintes usam o nome do botão (único, traz o nome do arquivo) e não o cartão. O "Desfazer" do passo 9 deve ser o
#   único da tela (o do "Mover para…" já terá sumido?).   # conferir
id: srv-arrumar-despesas
titulo: Arrumar as despesas antes de enviar
perfil: servidor
estado: inicial
inicio: /servidor/enviar
capitulo: capitulos/srv-enviar.md

abertura:
  titulo: Arrumar as despesas antes de enviar
  subtitulo: Guia do servidor

fecho:
  linhas:
    - Dúvidas? Fale com o RH pelo ramal 6457.
    - "Guia do servidor: capítulo Enviar os comprovantes do mês."

passos:
  - id: escolher
    narracao: Depois de escolher os arquivos do mês, o sistema lê cada um e monta as despesas.
    texto: Clique em **Escolher arquivos** e selecione os documentos do mês. O sistema lê cada um e monta as despesas.
    alvo: { papel: button, nome: Escolher arquivos }
    acao: enviar_arquivos
    arquivos:
      - documentos/boleto-escola-outubro.pdf
      - documentos/comprovante-pagamento-escola-outubro.pdf
      - documentos/recibo-plano-de-saude-outubro.pdf
    campo_arquivos: { rotulo: Escolher arquivos }
    espera_texto: Leitura concluída. Confira as despesas abaixo.
    captura: true

  - id: corrigir-dados
    narracao: Se a leitura automática pegou um dado errado, clique em Corrigir dados.
    texto: Se algum dado lido não confere com o documento, clique em **Corrigir dados** na despesa.
    alvo: { papel: button, nome: Corrigir dados, dentro: { papel: article, nome: Vida Plena Saúde (exemplo) } }
    acao: clicar
    captura: true

  - id: data
    narracao: Ajuste o campo, por exemplo a data do pagamento.
    texto: Ajuste o campo errado, por exemplo a **Data do pagamento**. O valor lido continua guardado ao lado.
    alvo: { rotulo: Data do pagamento, dentro: { papel: article, nome: Vida Plena Saúde (exemplo) } }
    acao: preencher
    valor: "2026-10-06"
    captura: true

  - id: concluir
    narracao: E clique em Concluir correção. A despesa passa a mostrar que o dado foi corrigido por você.
    texto: >-
      Clique em **Concluir correção**. A despesa é conferida de novo e mostra **Dado corrigido pelo servidor**.
    alvo: { papel: button, nome: Concluir correção, dentro: { papel: article, nome: Vida Plena Saúde (exemplo) } }
    acao: clicar
    espera_texto: Dado corrigido pelo servidor
    captura: true

  - id: separar
    narracao: >-
      Se o sistema juntou dois documentos que não são da mesma conta, clique em Separar documentos.
    texto: >-
      Se o sistema juntou num par dois documentos que não são da mesma conta, clique em **Separar documentos**: cada
      um vira uma despesa.
    alvo: { papel: button, nome: Separar documentos, dentro: { papel: article, nome: Colégio Horizonte (exemplo) } }
    acao: clicar
    captura: true

  - id: mover
    narracao: Para juntar de novo, ou levar um arquivo para outra despesa, use Mover para.
    texto: Para levar um arquivo a outra despesa, clique em **Mover para…** no arquivo.
    alvo: { papel: button, nome: "Mover para… comprovante-pagamento-escola-outubro.pdf" }
    acao: clicar
    captura: true

  - id: destino
    narracao: E escolha o destino.
    texto: Escolha a despesa de destino. O par volta a ficar completo.
    alvo: { papel: button, nome_comeca: "Mover para Colégio Horizonte" }   # conferir: "Mover para Colégio Horizonte (exemplo): comprovante de pagamento"
    acao: clicar
    captura: true

  - id: retirar
    narracao: Uma despesa que não deve ir ao RH sai com Retirar do envio.
    texto: Para tirar uma despesa deste envio, clique em **Retirar do envio**.
    alvo: { papel: button, nome: Retirar do envio, dentro: { papel: article, nome: Vida Plena Saúde (exemplo) } }
    acao: clicar
    captura: true

  - id: desfazer
    narracao: Retirou por engano? Clique em Desfazer, logo em seguida.
    texto: >-
      Retirou por engano? Clique em **Desfazer** na mensagem que aparece. Passados 10 minutos, crie a despesa de novo.
    alvo: { papel: button, nome: Desfazer, exato: true }
    acao: clicar
    captura: true

  - id: a-mao
    narracao: >-
      Se preferir montar uma despesa à mão, use Nova despesa, abaixo da área de envio.
    texto: >-
      Se preferir montar a despesa à mão, clique em **Prefere montar a despesa à mão? Nova despesa**, escolha o tipo e
      para quem é a despesa, e anexe os documentos em cada espaço.
    alvo: { papel: button, nome: "Prefere montar a despesa à mão? Nova despesa" }
    acao: clicar
    captura: true

  - id: formulario
    narracao: Escolha o tipo, a pessoa, e anexe os documentos. As despesas ficam guardadas até você enviar ao RH.
    texto: >-
      Escolha o **Tipo de despesa** e **Para quem é a despesa** e clique em **Criar despesa e anexar documentos**. O que
      você monta fica guardado até o envio ao RH, dentro do prazo do mês.
    alvo: { papel: form, nome: Nova despesa }
    acao: nenhuma
    captura: true
