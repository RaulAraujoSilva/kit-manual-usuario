passos:
  - id: painel
    narracao: >-
      A coordenação vê o mesmo painel do mês, com as filas do RH para acompanhar, sem os botões de ação.
    texto: >-
      A coordenação entra no painel da competência em andamento. As filas **O que precisa de você** aparecem com os
      números, para acompanhamento: aprovar, decidir e cobrar é do RH.
    alvo: { papel: heading, nome: O que precisa de você }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: cobrancas
    narracao: As cobranças automáticas também aparecem só para acompanhar.
    texto: >-
      Em **Cobranças automáticas**, a coordenação acompanha os lembretes e quem não enviou; pausar e reativar é do RH.
    alvo: { texto: "A coordenação acompanha as cobranças; pausar e reativar é do RH." }
    acao: nenhuma
    captura: true

  - id: indicadores
    narracao: >-
      Os indicadores do processo mostram a taxa de devolução, a taxa de erro na amostra, os servidores em dia e o tempo
      até o pagamento.
    texto: >-
      **Indicadores do processo**: aprovados sem análise individual, taxa de devolução, taxa de erro na amostra,
      servidores em dia e tempo entre envio e pagamento (mediana e 90%). As metas serão fixadas depois de três
      competências medidas.
    alvo: { papel: heading, nome: Indicadores do processo }
    acao: nenhuma
    captura: true

  - id: menu
    narracao: >-
      No menu, a coordenação tem o lote para autorizar, o relatório SEI e os perfis do RH a aprovar.
    texto: >-
      O menu da coordenação tem **Painel**, **Gerar lote** (para autorizar ou devolver), **Relatório SEI** e **Perfis a
      aprovar**.
    alvo: { papel: navigation, nome: Menu do RH }
    acao: nenhuma
    captura: true
