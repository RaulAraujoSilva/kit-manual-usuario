# RASCUNHO — Entrar e trocar a senha
# Perfil: servidor (Servidora 050213) | Telas: TL-01 /entrar, /senha | UC-01 | Vídeo: V01
# Manual: Guia do servidor › Entrar, trocar a senha e sair
#
# Estado necessário: qualquer um (só usa a conta). Rodar POR ÚLTIMO na sequência sem restauração: o passo final troca a
#   senha da conta de teste, e os roteiros seguintes do perfil `servidor` deixariam de entrar até restaurar o banco.
# Documentos fictícios: nenhum.
# Altera dados: senha da Servidora 050213 (volta com a restauração do banco); trilha "Trocou a senha".
# Precisa do motor: o motor sempre entra antes do primeiro passo; o passo "preparo" sai do sistema para mostrar a tela
#   de entrada. Melhor: opção no roteiro para não entrar antes (ex.: `entrar: false`), e este passo some.
# A faixa "Ambiente de teste: entrar como" fica oculta pelo caso.yaml (bloco `ocultar`).
id: srv-entrar
titulo: Entrar e trocar a senha
perfil: servidor
estado: atual
inicio: /sair
capitulo: capitulos/srv-entrar.md

abertura:
  titulo: Entrar e trocar a senha
  subtitulo: Guia do servidor

fecho:
  linhas:
    - Dúvidas? Fale com o RH pelo ramal 6457.
    - "Guia do servidor: capítulo Entrar, trocar a senha e sair."

passos:
  - id: preparo
    narracao: Para usar o sistema de comprovantes, abra o endereço do sistema no navegador.
    texto: Abra o endereço do sistema de comprovantes no navegador do computador ou do celular.
    alvo: { papel: button, nome: Sair, exato: true }
    acao: clicar
    captura: false

  - id: tela
    narracao: >-
      Esta é a tela de entrada. Você entra com o CPF ou a matrícula e a sua senha, sem escolher perfil: o sistema já
      abre a sua área.
    texto: >-
      Na tela de entrada, use o **CPF ou a matrícula** e a sua **senha**. Não é preciso escolher perfil: o sistema abre
      a sua área.
    alvo: { papel: heading, nome: Entrar, exato: true }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: identificador
    narracao: Digite o CPF ou a matrícula.
    texto: No campo **CPF ou matrícula**, digite um dos dois.
    alvo: { rotulo: CPF ou matrícula }
    acao: preencher
    valor: "50.213-4"
    captura: true

  - id: senha
    narracao: Depois, a senha.
    texto: No campo **Senha**, digite a sua senha.
    alvo: { rotulo: Senha, exato: true }
    acao: preencher
    valor: "Servidora-050213-Teste!"
    captura: false

  - id: entrar
    narracao: Clique em Entrar.
    texto: >-
      Clique em **Entrar**. Se a senha não conferir, a tela avisa sem dizer qual dado está errado; cinco tentativas
      erradas seguidas bloqueiam a entrada por 15 minutos.
    alvo: { papel: button, nome: Entrar, exato: true }
    acao: clicar
    captura: true

  - id: painel
    narracao: Pronto, você está no painel dos seus comprovantes.
    texto: O sistema abre o painel **Seus comprovantes**.
    alvo: { papel: heading, nome: Seus comprovantes, exato: true }
    acao: nenhuma
    captura: true
    enquadrar: tela

  - id: menu-usuario
    narracao: Para trocar a senha, abra o menu com o seu nome, no alto da tela.
    texto: Para trocar a senha, abra o menu com o **seu nome**, no alto à direita.
    alvo: { css: "header details > summary" }
    acao: clicar
    captura: true

  - id: abrir-troca
    narracao: Clique em Trocar senha.
    texto: Clique em **Trocar senha**.
    alvo: { papel: link, nome: Trocar senha, exato: true }
    acao: clicar
    captura: true

  - id: senha-atual
    narracao: Digite a senha atual.
    texto: Em **Senha atual (ou a provisória)**, digite a senha que você usa hoje.
    alvo: { rotulo: "Senha atual (ou a provisória)" }
    acao: preencher
    valor: "Servidora-050213-Teste!"
    captura: true

  - id: nova
    narracao: >-
      Agora, a nova senha, de doze a cento e vinte e oito caracteres. Uma frase longa é a melhor escolha.
    texto: >-
      Em **Nova senha**, digite a nova senha: de 12 a 128 caracteres, de preferência uma frase. Não use o CPF, a
      matrícula nem uma senha comum.
    alvo: { rotulo: Nova senha, exato: true }
    acao: preencher
    valor: "uma frase longa de exemplo para o manual"
    captura: true

  - id: repetir
    narracao: Repita a nova senha.
    texto: Em **Repita a nova senha**, digite a nova senha outra vez.
    alvo: { rotulo: Repita a nova senha }
    acao: preencher
    valor: "uma frase longa de exemplo para o manual"
    captura: false

  - id: trocar
    narracao: Clique em Trocar senha.
    texto: Clique em **Trocar senha**.
    alvo: { papel: button, nome: Trocar senha, exato: true }
    acao: clicar
    captura: true

  - id: trocada
    narracao: >-
      Senha trocada. Por segurança, todas as sessões abertas terminam, e você entra de novo com a senha nova.
    texto: >-
      A senha foi trocada. Por segurança, as sessões abertas terminam: clique em **Entrar de novo** e use a nova senha.
      Para sair do sistema a qualquer momento, abra o menu com o seu nome e clique em **Sair**.
    alvo: { texto: Senha trocada. Entre de novo com a nova senha. }
    acao: nenhuma
    captura: true
