# RASCUNHO — Ler os avisos
# Perfil: servidor (Servidora 050213) | Tela: TL-05 /servidor/avisos | UC-04 | Vídeo: V06 (parte 1 de 3)
# Manual: Guia do servidor › Ler os avisos e os e-mails
#
# Estado necessário: um comprovante da servidora Devolvido pelo RH e ainda não lido (depois do rh-devolver-conforme;
#   cópia "E2-devolvido"). Na carga inicial a lista dela fica vazia: a servidora já enviou outubro, então não recebe
#   lembrete, e nenhum comprovante dela foi devolvido.
# Documentos fictícios: nenhum.
# Altera dados: marca o aviso como lido.
id: srv-avisos
titulo: Ler os avisos
perfil: servidor
estado: atual
inicio: /servidor
capitulo: capitulos/srv-avisos.md

abertura:
  titulo: Ler os avisos
  subtitulo: Guia do servidor

fecho:
  linhas:
    - Dúvidas? Fale com o RH pelo ramal 6457.
    - "Guia do servidor: capítulo Ler os avisos e os e-mails."

passos:
  - id: sino
    narracao: Quando há aviso novo, o sino no alto da tela mostra quantos. Clique nele.
    texto: Quando há aviso novo, o **sino** no alto da tela mostra quantos. Clique nele.
    alvo: { papel: link, nome_comeca: "Avisos:" }   # conferir: "Avisos: 1 novo"
    acao: clicar
    captura: true

  - id: lista
    narracao: >-
      Aqui ficam os lembretes do prazo e as decisões do RH. O aviso novo aparece como não lido.
    texto: >-
      A página **Avisos** reúne os lembretes do prazo (15, 7 e 1 dia antes, só se ainda faltar enviar) e as decisões do
      RH. O aviso novo aparece como **Não lido**. Use **Não lidos** para ver só os novos.
    alvo: { css: 'article:has-text("Comprovante devolvido pelo RH")' }   # conferir: o cartão do aviso é um article
    acao: nenhuma
    captura: true

  - id: ver-motivo
    narracao: Clique em Ver motivo.
    texto: Clique em **Ver motivo**.
    alvo: { papel: button, nome: Ver motivo, dentro: { css: 'article:has-text("Comprovante devolvido pelo RH")' } }
    acao: clicar
    captura: true

  - id: motivo
    narracao: O motivo do RH aparece com o prazo para corrigir.
    texto: Aparecem o **motivo informado pelo RH**, a mensagem, quando houver, e o **prazo** para corrigir.
    alvo: { texto: Motivo informado pelo RH }
    acao: nenhuma
    captura: true

  - id: marcar-lido
    narracao: Depois de ler, marque como lido.
    texto: Clique em **Marcar como lido**.
    alvo: { papel: button, nome: Marcar como lido, dentro: { css: 'article:has-text("Comprovante devolvido pelo RH")' } }   # conferir: o botão pode sumir ao abrir o motivo
    acao: clicar
    captura: false

  - id: corrigir
    narracao: Para resolver, clique em Corrigir comprovante.
    texto: >-
      Para resolver, clique em **Corrigir comprovante** (veja o capítulo Corrigir um comprovante devolvido).
    alvo: { papel: link, nome: Corrigir comprovante, dentro: { css: 'article:has-text("Comprovante devolvido pelo RH")' } }
    acao: nenhuma
    captura: true

  - id: como-chegam
    narracao: >-
      O mesmo aviso chega ao seu e-mail institucional, sem valores nem o nome do emitente. O detalhe fica aqui.
    texto: >-
      Cada aviso também chega ao seu **e-mail institucional**, sem valores nem nome do emitente: o detalhe fica só no
      sistema.
    alvo: { papel: heading, nome: Como chegam os avisos }
    acao: nenhuma
    captura: true
