# RASCUNHO — Primeiro acesso com a senha provisória
# Perfil: pessoa com conta nova (na gravação: Servidora 040857, matrícula 40.857-8, conta criada pelo adm-contas)
# Telas: e-mail (Mailpit) + TL-01 /entrar + /senha (troca obrigatória) | UC-01, UC-17 | Vídeo: sem vídeo próprio
#   (pode entrar no V01 como "primeiro acesso")
# Manual: Guia do servidor › Entrar, trocar a senha e sair (seção "Primeiro acesso")
#
# Por que importa: na produção, os 185 servidores sem conta recebem a conta pela administração ou pela importação do
#   cadastro, sempre com senha provisória por e-mail, de uso único e válida por 24 horas.
# Estado necessário: conta 40.857-8 criada pelo adm-contas (e, se tiver perfil do RH pedido, aprovada pelo
#   crh-aprovar-acessos, que reenvia a provisória). O e-mail "Senha provisória do Sistema de comprovantes" para
#   servidor.040857@exemplo.invalido na caixa de teste.
# Documentos fictícios: nenhum.
# Altera dados: troca a senha da conta 40.857-8.
# Precisa do motor (NÃO RODA HOJE): (1) não entrar antes do primeiro passo; (2) abrir a caixa de teste
#   (http://localhost:8028), endereço absoluto; (3) ler a senha provisória do e-mail para uma variável e usá-la no
#   `valor` (aqui `{{senha_provisoria}}`). A senha provisória é sorteada pelo sistema: não há valor fixo para o roteiro.
id: srv-primeiro-acesso
titulo: Primeiro acesso com a senha provisória
perfil: servidor   # precisa do motor: perfil sem entrada prévia
estado: atual
inicio: "http://localhost:8028/"   # precisa do motor: endereço absoluto (caixa de teste)
capitulo: capitulos/srv-entrar.md

abertura:
  titulo: Primeiro acesso
  subtitulo: Guia do servidor

fecho:
  linhas:
    - Dúvidas? Fale com o RH pelo ramal 6457.
    - "Guia do servidor: capítulo Entrar, trocar a senha e sair."

passos:
  - id: email
    narracao: >-
      No primeiro acesso, você recebe no e-mail institucional uma senha provisória, que vale por vinte e quatro horas e
      para uma única entrada.
    texto: >-
      No primeiro acesso, chega ao seu e-mail institucional a mensagem **Senha provisória do Sistema de comprovantes**,
      com o login e uma senha provisória. Ela vale por 24 horas e para uma única entrada.
    alvo: { texto: Senha provisória do Sistema de comprovantes }   # conferir: assunto na lista do Mailpit
    acao: clicar
    captura: true

  - id: abrir-sistema
    narracao: Abra o sistema e entre com a matrícula e a senha provisória.
    texto: Abra o sistema e, na tela de entrada, digite o **CPF ou a matrícula** e a **senha provisória**.
    alvo: { rotulo: CPF ou matrícula }   # precisa do motor: navegar para caso.endereco + /entrar antes deste passo
    acao: preencher
    valor: "40.857-8"
    captura: true

  - id: senha-provisoria
    narracao: Digite a senha provisória.
    texto: No campo **Senha**, digite a senha provisória do e-mail.
    alvo: { rotulo: Senha, exato: true }
    acao: preencher
    valor: "{{senha_provisoria}}"   # precisa do motor: variável lida do e-mail
    captura: false

  - id: entrar
    narracao: Clique em Entrar.
    texto: Clique em **Entrar**.
    alvo: { papel: button, nome: Entrar, exato: true }
    acao: clicar
    captura: true

  - id: obrigatoria
    narracao: >-
      O sistema abre direto a troca de senha. Até você criar a sua senha, nenhuma outra tela abre.
    texto: >-
      O sistema abre direto **Trocar senha**: até você criar a sua senha, nenhuma outra tela abre.
    alvo: { texto: Você entrou com a senha provisória }
    acao: nenhuma
    captura: true

  - id: atual
    narracao: Em senha atual, digite de novo a provisória.
    texto: Em **Senha atual (ou a provisória)**, digite a senha provisória.
    alvo: { rotulo: "Senha atual (ou a provisória)" }
    acao: preencher
    valor: "{{senha_provisoria}}"
    captura: true

  - id: nova
    narracao: Crie a sua senha, uma frase longa, e repita.
    texto: Em **Nova senha** e **Repita a nova senha**, digite a sua senha nova, de 12 a 128 caracteres.
    alvo: { rotulo: Nova senha, exato: true }
    acao: preencher
    valor: "uma frase longa e nova para o primeiro acesso"
    captura: true

  - id: repetir
    narracao: ""   # sem fala: passo rápido (conferir se a narração aceita texto vazio)
    texto: Repita a nova senha.
    alvo: { rotulo: Repita a nova senha }
    acao: preencher
    valor: "uma frase longa e nova para o primeiro acesso"
    captura: false

  - id: trocar
    narracao: Clique em Trocar senha. Depois, entre de novo com a senha que você criou.
    texto: >-
      Clique em **Trocar senha** e depois em **Entrar de novo**, com a senha que você criou. A provisória não vale mais.
    alvo: { papel: button, nome: Trocar senha, exato: true }
    acao: clicar
    captura: true
